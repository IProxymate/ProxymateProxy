name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверка синтаксиса
        run: for f in src/*/*.js; do node --check "$f"; done
      - name: Тесты
        run: node --test "tests/*.test.mjs"
