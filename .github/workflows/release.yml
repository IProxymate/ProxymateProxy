name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тесты
        run: node --test "tests/*.test.mjs"

      - name: Проверить, что версия в manifest.json совпадает с тегом
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией в manifest.json ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Собрать zip
        run: |
          mkdir -p dist
          zip -r "dist/proxymate-proxy-${GITHUB_REF_NAME}.zip" manifest.json icons src -x '*.DS_Store'

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
